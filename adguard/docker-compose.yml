services:
  # Restored 2026-07-28. The container had been removed at some point but the
  # full config survived in C:/ServerData/AdGuard/conf, including the filter
  # lists and the existing login, so this brings it back rather than starting
  # over.
  #
  # Reached over Tailscale: the Jio router ignores custom DNS, so instead of
  # fighting it, the tailnet points at this host and every signed-in device gets
  # filtering at home AND on mobile data. Nothing on the router changes, so
  # nothing breaks for guests or for the house if this machine is off.
  #
  # Ports: 53 udp+tcp for DNS, 3080 for the web UI. 3080 avoids every port
  # already in use on this host (see CLAUDE.md); the container still serves its
  # UI on 80 internally, which is what the saved config expects.
  adguardhome:
    image: adguard/adguardhome:latest
    container_name: adguardhome
    volumes:
      - C:/ServerData/AdGuard/work:/opt/adguardhome/work
      - C:/ServerData/AdGuard/conf:/opt/adguardhome/conf
    ports:
      # Bound to the Tailscale address, NOT 0.0.0.0. Incident 2026-07-28:
      # publishing 53 on all interfaces silently failed --
      #   "failed to expose port: listen udp 0.0.0.0:53: bind: address already
      #    in use"
      # -- because WSL2's own DNS proxy already holds 10.255.255.254:53 inside
      # the docker-desktop distro. Docker reported the container as started and
      # `docker ps` showed "53/udp" with no host mapping, so nothing looked
      # wrong. That is how DNS ended up dead while everything appeared healthy.
      # Binding the Tailscale address specifically was tried and does NOT work:
      # `docker port` happily reports "53/udp -> 100.80.120.33:53" while no
      # Windows listener exists at all, because the WSL side cannot bind an
      # address that does not exist inside the VM. Verify with
      # `Get-NetUDPEndpoint -LocalPort 53`, never with `docker port`, which
      # reports the request rather than the result.
      #
      # The actual fix is dnsTunneling=false in %USERPROFILE%\.wslconfig, which
      # frees :53 inside the VM. Exposure is then limited at the firewall
      # instead: the "AdGuard DNS UDP/TCP" rules are scoped to 100.64.0.0/10 so
      # only tailnet devices can reach the resolver, never the LAN or the WAN.
      - "53:53/udp"
      - "53:53/tcp"
      - "3080:80/tcp"
    restart: always
