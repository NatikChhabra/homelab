<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JARVIS — Stark Industries</title>
<style>
:root {
  --cyan: #00d9ff;
  --cyan-dim: rgba(0,217,255,0.25);
  --cyan-glow: rgba(0,217,255,0.15);
  --amber: #ffc247;
  --amber-dim: rgba(255,194,71,0.25);
  --green: #00ffc8;
  --red: #ff5c6c;
  --bg: #050a10;
  --panel-bg: rgba(5,15,30,0.88);
  --panel-border: rgba(0,217,255,0.2);
  --text: #c8e8ff;
  --dim: #3a6080;
  --font: 'Courier New', Consolas, monospace;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 100%; height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  font-size: 13px;
  overflow-x: hidden;
  overflow-y: auto;
}
body[data-state="idle"] { background: linear-gradient(180deg, #030810 0%, #06101e 100%); }
body[data-state="listening"] { background: linear-gradient(180deg, #030810 0%, #041525 100%); }
body[data-state="thinking"] { background: linear-gradient(180deg, #0a0803 0%, #1a1205 100%); }
body[data-state="speaking"] { background: linear-gradient(180deg, #030a08 0%, #051a12 100%); }

/* ---- STARFIELD ---- */
#stars { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }

/* ---- LAYOUT ---- */
.hud { position: relative; z-index: 1; display: grid;
  grid-template-columns: 280px 1fr 280px;
  grid-template-rows: auto 1fr auto;
  grid-template-areas:
    "hdr hdr hdr"
    "left orb right"
    "ftr ftr ftr";
  min-height: 100vh;
  gap: 0;
}
@media (max-width: 1100px) {
  .hud { grid-template-columns: 1fr;
    grid-template-areas: "hdr" "orb" "left" "right" "ftr";
  }
  .left-panel, .right-panel { order: 2; }
  .orb-section { order: 1; }
  .hdr { order: 0; }
  .ftr { order: 3; }
}

/* ---- HEADER ---- */
.hdr {
  grid-area: hdr;
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 20px;
  border-bottom: 1px solid var(--panel-border);
  background: rgba(3,8,16,0.95);
}
.hdr-title {
  font-size: 18px; font-weight: bold; letter-spacing: 6px;
  color: var(--cyan); text-transform: uppercase;
  text-shadow: 0 0 20px var(--cyan), 0 0 40px rgba(0,217,255,0.3);
}
.hdr-sub { font-size: 10px; color: var(--dim); letter-spacing: 3px; margin-top: 2px; }
#clock { font-size: 20px; color: var(--cyan); letter-spacing: 2px; font-variant-numeric: tabular-nums; }
#status {
  font-size: 11px; letter-spacing: 3px; text-transform: uppercase;
  padding: 4px 12px; border: 1px solid var(--cyan-dim);
  color: var(--cyan); background: var(--cyan-glow);
  border-radius: 2px;
}
body[data-state="listening"] #status { color: var(--cyan); border-color: var(--cyan); }
body[data-state="thinking"] #status { color: var(--amber); border-color: var(--amber-dim); background: var(--amber-dim); }
body[data-state="speaking"] #status { color: var(--green); border-color: rgba(0,255,200,0.3); background: rgba(0,255,200,0.1); }

/* ---- ORB SECTION ---- */
.orb-section {
  grid-area: orb;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 16px;
  position: relative;
}
#orb-wrap {
  position: relative;
  width: 320px; height: 320px;
  display: flex; align-items: center; justify-content: center;
}
#orb-wrap::before {
  content: '';
  position: absolute; inset: -20px;
  border: 1px solid var(--panel-border);
  border-radius: 50%;
  box-shadow: 0 0 30px var(--cyan-glow), inset 0 0 30px var(--cyan-glow);
  animation: orb-pulse 4s ease-in-out infinite;
}
@keyframes orb-pulse {
  0%, 100% { box-shadow: 0 0 30px var(--cyan-glow), inset 0 0 30px var(--cyan-glow); }
  50% { box-shadow: 0 0 50px rgba(0,217,255,0.3), inset 0 0 50px rgba(0,217,255,0.15); }
}
#canvas { width: 320px; height: 320px; display: block; }
#timings {
  margin-top: 8px; font-size: 10px; color: var(--dim);
  letter-spacing: 1px; min-height: 14px;
}
#route {
  font-size: 10px; color: var(--dim); letter-spacing: 1px; min-height: 14px;
  margin-top: 2px;
}

/* ---- LOG ---- */
#log-wrap {
  width: 100%; max-width: 600px;
  margin-top: 12px;
  border: 1px solid var(--panel-border);
  background: rgba(3,8,16,0.9);
  border-radius: 4px;
  overflow: hidden;
}
#log {
  height: 120px; overflow-y: auto;
  padding: 8px 12px;
  font-size: 12px; line-height: 1.6;
}
#log::-webkit-scrollbar { width: 4px; }
#log::-webkit-scrollbar-track { background: transparent; }
#log::-webkit-scrollbar-thumb { background: var(--cyan-dim); border-radius: 2px; }
.line .who { color: var(--dim); margin-right: 8px; font-size: 10px; letter-spacing: 1px; }
.line.user .who { color: #78afff; }
.line.jarvis .who { color: var(--green); }
.line.sys .who { color: var(--amber); }

/* ---- INPUT AREA ---- */
#input-area {
  width: 100%; max-width: 600px;
  margin-top: 10px;
  display: flex; gap: 8px; align-items: center;
}
#textInput {
  flex: 1;
  background: rgba(0,217,255,0.06);
  border: 1px solid var(--panel-border);
  color: var(--text);
  padding: 8px 12px;
  font-family: var(--font);
  font-size: 13px;
  border-radius: 4px;
  outline: none;
  transition: border-color 0.2s;
}
#textInput:focus { border-color: var(--cyan); }
#textInput::placeholder { color: var(--dim); }
#ptt {
  width: 52px; height: 52px;
  border-radius: 50%;
  border: 2px solid var(--cyan);
  background: rgba(0,217,255,0.1);
  color: var(--cyan);
  font-size: 10px; font-weight: bold;
  cursor: pointer;
  transition: all 0.2s;
  letter-spacing: 1px;
  flex-shrink: 0;
}
#ptt:hover { background: rgba(0,217,255,0.2); box-shadow: 0 0 15px var(--cyan-dim); }
#ptt:disabled { border-color: var(--dim); color: var(--dim); cursor: not-allowed; background: transparent; }
#micNote { font-size: 10px; color: var(--amber); max-width: 600px; margin-top: 4px; min-height: 14px; }

/* ---- TEST BUTTONS ---- */
#test-bar {
  width: 100%; max-width: 600px;
  margin-top: 8px;
  display: flex; gap: 6px; flex-wrap: wrap;
}
.test-btn {
  background: rgba(0,217,255,0.06);
  border: 1px solid var(--panel-border);
  color: var(--dim);
  padding: 4px 10px;
  font-family: var(--font);
  font-size: 10px;
  cursor: pointer;
  border-radius: 2px;
  letter-spacing: 1px;
  transition: all 0.2s;
}
.test-btn:hover { border-color: var(--cyan); color: var(--cyan); }

/* ---- PANELS ---- */
.left-panel { grid-area: left; padding: 12px 16px; overflow-y: auto; max-height: calc(100vh - 140px); }
.right-panel { grid-area: right; padding: 12px 16px; overflow-y: auto; max-height: calc(100vh - 140px); }
.ftr {
  grid-area: ftr;
  display: flex; align-items: center; justify-content: space-between;
  padding: 8px 20px;
  border-top: 1px solid var(--panel-border);
  background: rgba(3,8,16,0.95);
  font-size: 10px; color: var(--dim);
}
.ftr a { color: var(--cyan); text-decoration: none; }
.ftr a:hover { text-decoration: underline; }

/* ---- PANEL NAV ---- */
.panel-nav {
  display: flex; gap: 2px; margin-bottom: 12px;
  border-bottom: 1px solid var(--panel-border);
  padding-bottom: 0;
}
.navbtn {
  background: transparent;
  border: none;
  border-bottom: 2px solid transparent;
  color: var(--dim);
  padding: 6px 10px;
  font-family: var(--font);
  font-size: 10px;
  cursor: pointer;
  letter-spacing: 1px;
  text-transform: uppercase;
  transition: all 0.2s;
}
.navbtn:hover { color: var(--cyan); }
.navbtn[aria-selected="true"] { color: var(--cyan); border-bottom-color: var(--cyan); }

/* ---- PANEL CONTENT ---- */
.view { display: none; }
.view.active { display: block; }
.stack { outline: none; }

/* ---- HUD COMPONENTS ---- */
.panel {
  background: var(--panel-bg);
  border: 1px solid var(--panel-border);
  border-radius: 4px;
  padding: 10px 12px;
  margin-bottom: 10px;
}
.panel-label {
  font-size: 9px; letter-spacing: 2px; text-transform: uppercase;
  color: var(--dim); margin-bottom: 8px;
  display: flex; justify-content: space-between; align-items: center;
}
.panel-label .age { font-size: 9px; color: var(--dim); opacity: 0.6; }
.bigval { font-size: 28px; font-weight: bold; color: var(--cyan); letter-spacing: 2px; }
.bigval small { font-size: 11px; color: var(--dim); font-weight: normal; letter-spacing: 0; }
.cap { font-size: 9px; letter-spacing: 2px; color: var(--dim); text-transform: uppercase; margin-top: 4px; }
.sub { font-size: 10px; color: var(--dim); margin-top: 2px; }
.kv { display: flex; justify-content: space-between; padding: 3px 0; font-size: 11px; border-bottom: 1px solid rgba(0,217,255,0.06); }
.kv span:last-child { color: var(--cyan); }
.metric { margin-bottom: 6px; }
.metric-top { display: flex; justify-content: space-between; font-size: 10px; margin-bottom: 3px; }
.track { height: 4px; background: rgba(0,217,255,0.1); border-radius: 2px; overflow: hidden; }
.track .fill { height: 100%; background: var(--cyan); border-radius: 2px; transition: width 0.5s; }
.track .fill.warm { background: var(--amber); }
.track .fill.hot { background: var(--red); }
.gaugerow { display: flex; gap: 16px; align-items: flex-start; flex-wrap: wrap; }
.gauge { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.unavailable { background: rgba(255,92,108,0.08); border: 1px solid rgba(255,92,108,0.3); border-radius: 4px; padding: 8px 12px; font-size: 11px; color: var(--red); }
.unavailable b { display: block; margin-bottom: 4px; font-size: 10px; letter-spacing: 1px; }
.note { font-size: 10px; color: var(--dim); margin-top: 6px; line-height: 1.5; }
.seg { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 6px; }
.seg button, .tile {
  background: rgba(0,217,255,0.06);
  border: 1px solid var(--panel-border);
  color: var(--text);
  padding: 4px 8px;
  font-family: var(--font);
  font-size: 10px;
  cursor: pointer;
  border-radius: 2px;
  letter-spacing: 1px;
  transition: all 0.15s;
}
.seg button:hover, .tile:hover { border-color: var(--cyan); color: var(--cyan); }
.seg button.sel { background: var(--cyan-dim); border-color: var(--cyan); color: var(--cyan); }
.tile { display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 60px; padding: 8px 6px; }
.tile.dead { opacity: 0.35; cursor: not-allowed; }
.tile.on { border-color: var(--green); color: var(--green); }
.tile-icon { font-size: 16px; }
.tile-name { font-size: 9px; text-align: center; letter-spacing: 0.5px; }
.tile-sub { font-size: 8px; color: var(--dim); }
.tilegrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); gap: 4px; }
.thermo { position: relative; margin-top: 8px; }
.thermo input[type=range] {
  width: 100%; height: 4px; -webkit-appearance: none; appearance: none;
  background: linear-gradient(to right, var(--cyan) var(--pct, 50%), rgba(0,217,255,0.15) var(--pct, 50%));
  border-radius: 2px; outline: none;
}
.thermo input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none; width: 14px; height: 14px;
  background: var(--cyan); border-radius: 50%; cursor: pointer;
  box-shadow: 0 0 6px var(--cyan);
}
.temp-read { font-size: 18px; color: var(--cyan); text-align: center; margin-top: 4px; }
.grid2 { display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: center; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.poster { border-radius: 3px; border: 1px solid var(--panel-border); }
.postergrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 6px; }
.postercap { font-size: 9px; color: var(--dim); text-align: center; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pill { display: inline-block; padding: 3px 8px; margin: 2px 4px 2px 0;
  border-radius: 2px; font-size: 10px; letter-spacing: 1px;
  border: 1px solid var(--panel-border); color: var(--dim);
}
.pill.ok { border-color: rgba(0,255,200,0.4); color: var(--green); background: rgba(0,255,200,0.08); }
.pill.bad { border-color: rgba(255,92,108,0.4); color: var(--red); background: rgba(255,92,108,0.08); }
.diag { display: flex; justify-content: space-between; padding: 4px 0; font-size: 11px; border-bottom: 1px solid rgba(0,217,255,0.08); }
.diag span.ok { color: var(--green); }
.diag span.bad { color: var(--red); }
.core { display: flex; flex-direction: column; align-items: center; gap: 2px; }
.core i { display: block; width: 3px; background: var(--cyan); border-radius: 1px; transition: height 0.3s; }
.core i.warm { background: var(--amber); }
.core i.hot { background: var(--red); }

/* ---- SPECIALISTS ---- */
.spec-grid { display: grid; grid-template-columns: 1fr; gap: 4px; }
.spec-item {
  display: flex; align-items: center; gap: 8px;
  padding: 6px 8px;
  background: rgba(0,217,255,0.04);
  border: 1px solid var(--panel-border);
  border-radius: 3px;
  font-size: 11px;
}
.spec-item .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); flex-shrink: 0; }
.spec-item .dot.off { background: var(--dim); }
.spec-item .name { color: var(--cyan); letter-spacing: 1px; }
.spec-item .desc { color: var(--dim); font-size: 10px; }

/* ---- MAP ---- */
#mapCanvas { width: 100%; height: 280px; border: 1px solid var(--panel-border); border-radius: 4px; display: block; background: #071018; cursor: grab; }
#mapCanvas:active { cursor: grabbing; }
.mapctl { display: flex; gap: 4px; margin-top: 6px; }
.mapctl button { padding: 3px 8px; font-size: 10px; }

/* ---- WEATHER ---- */
.sun-info { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }

/* ---- MEDIA ---- */
.media-row { display: flex; gap: 8px; align-items: center; padding: 6px 0; border-bottom: 1px solid rgba(0,217,255,0.06); }
.media-row img { width: 50px; height: 70px; object-fit: cover; border: 1px solid var(--panel-border); border-radius: 2px; }

/* ---- QUICK PROMPTS ---- */
#quickPrompts { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
#quickPrompts button { font-size: 9px; padding: 3px 7px; }

/* ---- SCROLLBAR ---- */
.left-panel::-webkit-scrollbar, .right-panel::-webkit-scrollbar { width: 4px; }
.left-panel::-webkit-scrollbar-track, .right-panel::-webkit-scrollbar-track { background: transparent; }
.left-panel::-webkit-scrollbar-thumb, .right-panel::-webkit-scrollbar-thumb { background: var(--cyan-dim); border-radius: 2px; }
</style>
</head>
<body>
<canvas id="stars"></canvas>

<div class="hud">
  <!-- HEADER -->
  <header class="hdr">
    <div>
      <div class="hdr-title">J.A.R.V.I.S.</div>
      <div class="hdr-sub">STARK INDUSTRIES — Voice Interface v2.0</div>
    </div>
    <div id="status">SAY "HEY JARVIS"</div>
    <div id="clock">00:00:00</div>
  </header>

  <!-- LEFT PANEL -->
  <aside class="left-panel">
    <div class="panel-nav">
      <button class="navbtn" data-panel="home" aria-selected="true">Home</button>
      <button class="navbtn" data-panel="vitals" aria-selected="false">Vitals</button>
      <button class="navbtn" data-panel="devices" aria-selected="false">Devices</button>
      <button class="navbtn" data-panel="weather" aria-selected="false">Weather</button>
      <button class="navbtn" data-panel="media" aria-selected="false">Media</button>
      <button class="navbtn" data-panel="map" aria-selected="false">Map</button>
    </div>

    <!-- HOME -->
    <div class="view active" data-view="home">
      <div class="panel">
        <div class="panel-label">PIPELINE STATUS <span class="age" id="statusAge">—</span></div>
        <div id="vitalsPills"></div>
        <div class="panel-label" style="margin-top:12px">ROUTER BREAKDOWN</div>
        <div id="routerBreakdown"></div>
      </div>
      <div class="panel">
        <div class="panel-label">QUICK ACTIONS</div>
        <div id="quickTiles"></div>
      </div>
      <div class="panel">
        <div class="panel-label">SUGGESTED COMMANDS</div>
        <div id="quickPrompts"></div>
      </div>
    </div>

    <!-- VITALS -->
    <div class="view" data-view="vitals">
      <div id="vitalsBody"></div>
    </div>

    <!-- DEVICES -->
    <div class="view" data-view="devices">
      <div id="devicesBody"></div>
    </div>

    <!-- WEATHER -->
    <div class="view" data-view="weather">
      <div id="weatherBody"></div>
    </div>

    <!-- MEDIA -->
    <div class="view" data-view="media">
      <div id="mediaBody"></div>
    </div>

    <!-- MAP -->
    <div class="view" data-view="map">
      <canvas id="mapCanvas"></canvas>
      <div class="mapctl">
        <button data-map="in">+</button>
        <button data-map="out">−</button>
        <button data-map="home">HOME</button>
      </div>
      <div id="mapMeta"></div>
      <div id="mapCoords"></div>
      <div id="mapAttrib" class="note" style="margin-top:4px"></div>
    </div>
  </aside>

  <!-- ORB SECTION -->
  <main class="orb-section">
    <div id="orb-wrap">
      <canvas id="canvas"></canvas>
    </div>
    <div id="orb-label" style="margin-top:8px;font-size:11px;color:var(--dim);letter-spacing:2px;text-transform:uppercase">ARC REACTOR</div>
    <div id="timings"></div>
    <div id="route"></div>
    <div id="log-wrap">
      <div id="log"></div>
    </div>
    <div id="input-area">
      <button id="ptt">PTT</button>
      <form id="textForm" style="flex:1;display:flex;gap:8px">
        <input id="textInput" type="text" placeholder="Type a command…" autocomplete="off">
      </form>
    </div>
    <div id="micNote"></div>
    <div id="test-bar">
      <button class="test-btn" onclick="JARVIS && JARVIS.send('beep')">BEEP TEST</button>
      <button class="test-btn" onclick="JARVIS && JARVIS.send('test tts')">TTS TEST</button>
      <button class="test-btn" onclick="JARVIS && JARVIS.send('what can you do')">CAPABILITIES</button>
      <button class="test-btn" onclick="JARVIS && JARVIS.send('show vitals')">SHOW VITALS</button>
      <button class="test-btn" onclick="JARVIS && JARVIS.send('show devices')">SHOW DEVICES</button>
    </div>
  </main>

  <!-- RIGHT PANEL -->
  <aside class="right-panel">
    <div class="panel">
      <div class="panel-label">SPECIALISTS</div>
      <div class="spec-grid" id="specialists"></div>
    </div>
    <div class="panel">
      <div class="panel-label">DIAGNOSTICS</div>
      <div id="diagBody"></div>
    </div>
    <div class="panel">
      <div class="panel-label">SYSTEM</div>
      <div id="systemInfo"></div>
    </div>
  </aside>

  <!-- FOOTER -->
  <footer class="ftr">
    <span>Tailscale: <a id="tailscaleLink" href="#">100.64.0.1</a> &nbsp;·&nbsp; Jarvis Voice &nbsp;·&nbsp; Local-first AI</span>
    <span>
      <a href="/docs/summary" target="_blank">Project Summary</a>
      &nbsp;·&nbsp;
      <a href="/static/jarvis-skin.zip" download>HUD Skin</a>
      &nbsp;·&nbsp;
      <span id="diagAge"></span>
    </span>
  </footer>
</div>

<script src="/static/mic-worklet.js"></script>
<script src="/static/app.js"></script>
<script src="/static/hud.js"></script>
<script>
// Specialists list
(function() {
  const specs = [
    { name: 'Homescreen', desc: 'Device & environment', ok: true },
    { name: 'Map', desc: 'Location & tracking', ok: true },
    { name: 'Vitals', desc: 'System health', ok: true },
    { name: 'Devices', desc: 'HA entity control', ok: true },
    { name: 'Weather', desc: 'Forecast & sun', ok: true },
    { name: 'Media', desc: 'Jellyfin playback', ok: true },
    { name: 'Web Search', desc: 'SearxNG + Ollama', ok: true },
    { name: 'WhatsApp', desc: 'Send & read', ok: false },
    { name: 'Calls', desc: 'Bluetooth HFP', ok: false },
  ];
  const host = document.getElementById('specialists');
  if (!host) return;
  specs.forEach(s => {
    const item = document.createElement('div');
    item.className = 'spec-item';
    item.innerHTML = `<span class="dot ${s.ok ? '' : 'off'}"></span><span class="name">${s.name}</span><span class="desc">${s.desc}</span>`;
    host.append(item);
  });
})();

// System info
(function() {
  const host = document.getElementById('systemInfo');
  if (!host) return;
  const items = [
    ['STT', 'Whisper small-int8 · English'],
    ['TTS', 'Kokoro · george+lewis+fable'],
    ['LLM', 'Ollama · qwen2.5:3b'],
    ['Wake', 'openWakeWord · hey_jarvis'],
    ['OS', navigator.platform],
    ['Lang', 'en'],
  ];
  items.forEach(([k, v]) => {
    const row = document.createElement('div');
    row.className = 'kv';
    row.innerHTML = `<span>${k}</span><span>${v}</span>`;
    host.append(row);
  });
})();

// Tailscale link
(function() {
  const link = document.getElementById('tailscaleLink');
  if (link) link.textContent = window.location.hostname;
})();
</script>
</body>
</html>
