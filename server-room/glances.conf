# Glances config for the server-room stack.
#
# Two things were wrong before this file existed, both visible as errors at the
# bottom of the web UI:
#
#  1. SENSORS returned an empty list. Glances runs in a container on Docker
#     Desktop, whose "host" is a Linux VM -- there is no thermal or fan data to
#     read, because the real machine is Windows and its sensors are never
#     exposed to that VM. The panel could therefore never populate, so it is
#     disabled rather than left rendering an error forever.
#
#  2. The FS plugin reported Docker's injected config files as if they were
#     disks:
#         /etc/resolv.conf  ext4  1081.1 GB
#         /etc/hostname     ext4  1081.1 GB
#         /etc/hosts        ext4  1081.1 GB
#     Those are bind mounts Docker adds to every container. They all report the
#     size of the underlying VM disk, which is why the same 1081 GB appeared
#     three times. Hiding them leaves the real mounts visible.

[sensors]
disable=True

[fs]
# Docker's injected files, which otherwise appear as three identical 1081 GB
# "disks". Kept deliberately narrow: an earlier attempt also excluded /proc,
# /sys, /dev and /run, and that filtered the plugin down to nothing at all --
# the real /hostfs mounts disappeared along with the noise.
hide=/etc/resolv.conf,/etc/hostname,/etc/hosts,/etc/glances/glances.conf,/run/docker.sock,/dev/shm

[diskio]
hide=loop.*,ram.*

[network]
# Docker's per-container veth pairs churn constantly and mean nothing here.
hide=veth.*,docker.*,br-.*,lo

[processlist]
# Sort by CPU by default; this box is usually CPU-bound during transcoding
# rather than memory-bound.
sort_key=cpu_percent
