# mem_limit on every service, added 2026-07-29.
#
# Until now NOT ONE of the 23 running containers had a memory limit. The host
# has 15.4 GB and the WSL2 VM is capped at 10 GB, so a single runaway container
# -- Immich's ML worker during face detection, or a Jellyfin software transcode,
# which is the only kind available here since there is no /dev/dri -- could
# exhaust the VM and take down EVERY container with it. That includes
# adguardhome, which is DNS for every device on the tailnet, so the blast radius
# of one leaking container was the whole house losing name resolution.
#
# These are CAPS, not reservations. Their sum deliberately exceeds the 10 GB VM:
# nothing is pre-allocated, and the job of the number is to stop one process
# eating everything, not to partition the VM between services. Each limit is
# roughly 3-4x the container's observed steady-state usage (measured
# 2026-07-29 via docker stats), with more headroom where the workload is known
# to be spiky rather than flat.
#
# If a container starts getting OOM-killed, its limit is too low for real
# workload -- raise that one number. Check with:
#   docker inspect -f '{{.State.OOMKilled}}' <name>
services:
  # maintainerr + cleanuparr removed 2026-11-01 (audit: both unconfigured -- 0 rules --
  # and unauthenticated, Maintainerr served the Sonarr/Radarr/Jellyfin keys).
  # Their config volumes were deleted 2026-11-01 (they held the leaked keys);
  # 14 days of tarballs remain in D:/Backups for restore.
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    # 82 MB idle, but this is the one that grows with work: disk cache, and a
    # recheck of a large torrent walks the whole file. 35 torrents today.
    mem_limit: 2g
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Kolkata
      - WEBUI_PORT=8080
    volumes:
      - qbittorrent_config:/config
      - D:/Media:/data
    ports:
      - "8080:8080"
      - "6881:6881"
      - "6881:6881/udp"
    restart: always

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    # 232 MB idle. Indexer fan-out across 36 indexers is network-bound, not memory-bound.
    mem_limit: 1g
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Kolkata
    volumes:
      - prowlarr_config:/config
    ports:
      - "9696:9696"
    dns:
      - 1.1.1.1
      - 8.8.8.8
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
    restart: always

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    # 323 MB idle and it IS a Chromium instance, so it is the spikiest of the small services.
    mem_limit: 1g
    environment:
      - LOG_LEVEL=info
      - TZ=Asia/Kolkata
    # 2026-11-01 audit: no host port. Prowlarr reaches it as http://flaresolverr:8191
    # over the compose network; publishing it only exposed it unauthenticated.
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
    restart: always

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    # 225 MB idle. Import scans and the rolling-window API traffic stay flat.
    mem_limit: 1g
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Kolkata
    volumes:
      - sonarr_config:/config
      - D:/Media:/data
    ports:
      - "8989:8989"
    dns:
      - 1.1.1.1
      - 8.8.8.8
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
    restart: always

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    # 218 MB idle, same shape as sonarr.
    mem_limit: 1g
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Kolkata
    volumes:
      - radarr_config:/config
      - D:/Media:/data
    ports:
      - "7878:7878"
    dns:
      - 1.1.1.1
      - 8.8.8.8
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
    restart: always

  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    # 287 MB idle -- highest of the *arr set, subtitle extraction holds files in memory.
    mem_limit: 1g
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Kolkata
    volumes:
      - bazarr_config:/config
      - D:/Media:/data
    ports:
      - "6767:6767"
    dns:
      - 1.1.1.1
      - 8.8.8.8
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
    restart: always

  # NVIDIA_VISIBLE_DEVICES/NVIDIA_DRIVER_CAPABILITIES removed 2026-07-27: host
  # GPU is AMD Radeon, no DeviceRequests, no /dev/dri — the vars did nothing.
  # Jellyfin's encoding.xml already has HardwareAccelerationType=none.
  # dns + disable_ipv6 added 2026-07-27 to match the *arr services: without
  # them jellyfin used ISP DNS, which resolves api.themoviedb.org to a hijacked
  # 49.44.79.236 (connect times out) and returns an unreachable AAAA record.
  # Symptom was "Network is unreachable (api.themoviedb.org:443)" and no
  # metadata/artwork. Other HTTPS was unaffected, so it looked like TMDb only.
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    # 361 MB idle. 3g cap kept for headroom; since 2026-11-01 transcodes run on the
    # RTX 3050 (NVENC) rather than in software, so the memory spikes are far smaller.
    mem_limit: 3g
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Kolkata
      # 2026-11-01: the 12.x (Ubuntu 26.04) image resolves TMDb to IPv6 first and
      # IPv6 is disabled below, so metadata calls died instantly. Keep .NET on IPv4.
      - DOTNET_SYSTEM_NET_DISABLEIPV6=1
      # 2026-11-01: RTX 3050 (NVENC/NVDEC) for transcoding instead of the CPU.
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,video,utility
      # 2026-11-01: Airtel resets most TLS handshakes to *.themoviedb.org (SNI
      # filtering, ~60-90% of attempts). Outbound metadata goes through the
      # warp service below; LAN and sibling containers stay direct.
      - HTTP_PROXY=http://warp:1080
      - HTTPS_PROXY=http://warp:1080
      - NO_PROXY=localhost,127.0.0.1,jellyseerr,sonarr,radarr,bazarr,prowlarr,qbittorrent,192.168.1.107
    volumes:
      - jellyfin_config:/config
      - D:/Media:/data
    # Docker Desktop (WSL2) GPU passthrough; verified with hevc_nvenc at 4.4x realtime.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    ports:
      - "8096:8096"
    dns:
      - 1.1.1.1
      - 8.8.8.8
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
    restart: always

  # Jellyseerr was renamed upstream to Seerr (2026). fallenbagel/jellyseerr
  # is frozen at 2.7.3 (published 2025-08-14) and no longer receives fixes.
  # Service/container name kept as "jellyseerr" on purpose: Homarr ping_url
  # and Uptime Kuma monitors resolve http://jellyseerr:5055 by container name.
  # Seerr runs non-root (UID 1000) and requires init: true.
  # Rollback: Backups/jellyseerr_config_20260726-pre-seerr.tar.gz
  jellyseerr:
    image: ghcr.io/seerr-team/seerr:latest
    container_name: jellyseerr
    # 260 MB idle. Node, so it grows to fill what it is given -- a cap is what bounds it.
    mem_limit: 1g
    init: true
    environment:
      - TZ=Asia/Kolkata
      # Belt-and-braces, added 2026-07-28. Disabling IPv6 via the sysctl below
      # stops IPv6 TRAFFIC but does not stop the resolver returning AAAA
      # records, so Node can still try an unroutable IPv6 address first. This
      # makes it prefer A records.
      #
      # Honest note on provenance: this was added while chasing intermittent
      # "Connection reset by peer" errors reaching api.themoviedb.org, but it
      # was NOT shown to fix them -- those resets were reproduced with busybox
      # wget, which NODE_OPTIONS does not affect, and they continued afterwards
      # at the same rate. The app itself logs no TMDB errors at all, so the
      # resets look like CDN-side TLS behaviour against an unauthenticated
      # request, not a jellyseerr fault. Kept because preferring A records on an
      # IPv6-disabled stack is correct regardless. Do not cite it as the fix.
      - NODE_OPTIONS=--dns-result-order=ipv4first
    volumes:
      - jellyseerr_config:/app/config
    ports:
      - "5055:5055"
    dns:
      - 1.1.1.1
      - 8.8.8.8
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
    restart: always

  # EXPERIMENTAL — Tiramisu torrent-streaming FUSE filesystem.
  # DISABLED 2026-07-26: mrrobotogit/tiramisu:latest (built 2026-07-19) is
  # broken upstream — docker-entrypoint.sh line 72 execs
  # /usr/local/bin/gostream, which is not shipped in the image. Container
  # exits 127 immediately. Host FUSE support was verified working
  # (/dev/fuse present, CAP_SYS_ADMIN granted), so this is purely an
  # upstream packaging bug. Re-enable once upstream ships gostream.
  # NOTE: do NOT bind-mount the fuse_mount_path (virtual) dir — the
  # container creates the FUSE mount there itself and logs
  # "Non-FUSE mountpoint ... (Docker bind), leaving intact" if pre-bound.
  #
  # tiramisu:
  #   image: mrrobotogit/tiramisu:latest
  #   container_name: tiramisu
  #   devices:
  #     - /dev/fuse
  #   cap_add:
  #     - SYS_ADMIN
  #     - NET_ADMIN
  #   security_opt:
  #     - apparmor:unconfined
  #   environment:
  #     - TZ=Asia/Kolkata
  #   volumes:
  #     - C:/ServerData/Tiramisu/config/config.json:/config.json:ro
  #     - C:/ServerData/Tiramisu/real:/mnt/tiramisu-mkv-real
  #   ports:
  #     - "8090:8090"
  #     - "9080:9080"
  #   restart: "no"

  # Cloudflare WARP as an HTTP+SOCKS5 proxy on :1080, reachable only on the
  # streaming network (no host port). Used by jellyfin (env) and jellyseerr
  # (Settings > Network > proxy) to get past Airtel's TMDb filtering.
  warp:
    image: caomingjun/warp:latest
    container_name: warp
    mem_limit: 384m
    # 2026-11-10: no swap. warp-svc leaks; with Docker's default 2x swap it sat at its
    # cap swapping (~700 MB anon+swap, the VM's main swap traffic). Baseline ~150 MiB.
    memswap_limit: 384m
    # An OOM kill hits warp-svc (largest process), NOT the container's PID 1, so the
    # container stayed up with gost proxying over the plain ISP route and restart:
    # always never fired (review 2026-11-11). This wrapper exits the container when
    # warp-svc or the image's entrypoint is gone, so Docker restarts it in seconds.
    entrypoint:
      - /bin/bash
      - -c
      - >-
        trap 'kill $$CHILD 2>/dev/null; exit 0' TERM INT;
        /entrypoint.sh & CHILD=$$!;
        sleep 60;
        while pgrep -x warp-svc >/dev/null && kill -0 $$CHILD 2>/dev/null; do sleep 10 & wait $$!; done;
        echo 'warp-svc gone (OOM?) - exiting so restart: always brings warp back';
        exit 1
    device_cgroup_rules:
      - 'c 10:200 rwm'
    environment:
      - WARP_SLEEP=2
    cap_add:
      - NET_ADMIN
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=0
      - net.ipv4.conf.all.src_valid_mark=1
    volumes:
      - warp_data:/var/lib/cloudflare-warp
    restart: always

volumes:
  warp_data:
  prowlarr_config:
    external: true
  bazarr_config:
    external: true
  radarr_config:
    external: true
  sonarr_config:
    external: true
  jellyseerr_config:
    external: true
  qbittorrent_config:
    external: true
  jellyfin_config:
    external: true
