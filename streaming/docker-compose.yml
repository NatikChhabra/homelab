# mem_limit on every service, added 2026-07-29.
#
# Until now NOT ONE of the 23 running containers had a memory limit. The host
# has 15.4 GB and the WSL2 VM is capped at 10 GB, so a single runaway container
# -- Immich's ML worker during face detection, or a Jellyfin software transcode,
# which is the only kind available here since there is no /dev/dri -- could
# exhaust the VM and take down EVERY container with it. That includes
# adguardhome, which is DNS for every device on the tailnet, so the blast radius
# of one leaking container was the whole house losing name resolution.
#
# These are CAPS, not reservations. Their sum deliberately exceeds the 10 GB VM:
# nothing is pre-allocated, and the job of the number is to stop one process
# eating everything, not to partition the VM between services. Each limit is
# roughly 3-4x the container's observed steady-state usage (measured
# 2026-07-29 via docker stats), with more headroom where the workload is known
# to be spiky rather than flat.
#
# If a container starts getting OOM-killed, its limit is too low for real
# workload -- raise that one number. Check with:
#   docker inspect -f '{{.State.OOMKilled}}' <name>
services:
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    # 82 MB idle, but this is the one that grows with work: disk cache, and a
    # recheck of a large torrent walks the whole file. 35 torrents today.
    mem_limit: 2g
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Kolkata
      - WEBUI_PORT=8080
    volumes:
      - qbittorrent_config:/config
      - D:/Media:/data
    ports:
      - "8080:8080"
      - "6881:6881"
      - "6881:6881/udp"
    restart: always

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    # 232 MB idle. Indexer fan-out across 36 indexers is network-bound, not memory-bound.
    mem_limit: 1g
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Kolkata
    volumes:
      - prowlarr_config:/config
    ports:
      - "9696:9696"
    dns:
      - 1.1.1.1
      - 8.8.8.8
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
    restart: always

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    # 323 MB idle and it IS a Chromium instance, so it is the spikiest of the small services.
    mem_limit: 1g
    environment:
      - LOG_LEVEL=info
      - TZ=Asia/Kolkata
    ports:
      - "8191:8191"
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
    restart: always

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    # 225 MB idle. Import scans and the rolling-window API traffic stay flat.
    mem_limit: 1g
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Kolkata
    volumes:
      - sonarr_config:/config
      - D:/Media:/data
    ports:
      - "8989:8989"
    dns:
      - 1.1.1.1
      - 8.8.8.8
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
    restart: always

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    # 218 MB idle, same shape as sonarr.
    mem_limit: 1g
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Kolkata
    volumes:
      - radarr_config:/config
      - D:/Media:/data
    ports:
      - "7878:7878"
    dns:
      - 1.1.1.1
      - 8.8.8.8
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
    restart: always

  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    # 287 MB idle -- highest of the *arr set, subtitle extraction holds files in memory.
    mem_limit: 1g
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Kolkata
    volumes:
      - bazarr_config:/config
      - D:/Media:/data
    ports:
      - "6767:6767"
    dns:
      - 1.1.1.1
      - 8.8.8.8
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
    restart: always

  # NVIDIA_VISIBLE_DEVICES/NVIDIA_DRIVER_CAPABILITIES removed 2026-07-27: host
  # GPU is AMD Radeon, no DeviceRequests, no /dev/dri — the vars did nothing.
  # Jellyfin's encoding.xml already has HardwareAccelerationType=none.
  # dns + disable_ipv6 added 2026-07-27 to match the *arr services: without
  # them jellyfin used ISP DNS, which resolves api.themoviedb.org to a hijacked
  # 49.44.79.236 (connect times out) and returns an unreachable AAAA record.
  # Symptom was "Network is unreachable (api.themoviedb.org:443)" and no
  # metadata/artwork. Other HTTPS was unaffected, so it looked like TMDb only.
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    # 361 MB idle. HIGHEST CAP HERE ON PURPOSE: with no /dev/dri every transcode is
    # software, and a 4K software transcode is the single largest legitimate
    # memory spike on this box. 3g leaves room for two concurrent streams.
    mem_limit: 3g
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Kolkata
    volumes:
      - jellyfin_config:/config
      - D:/Media:/data
    ports:
      - "8096:8096"
    dns:
      - 1.1.1.1
      - 8.8.8.8
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
    restart: always

  # Jellyseerr was renamed upstream to Seerr (2026). fallenbagel/jellyseerr
  # is frozen at 2.7.3 (published 2025-08-14) and no longer receives fixes.
  # Service/container name kept as "jellyseerr" on purpose: Homarr ping_url
  # and Uptime Kuma monitors resolve http://jellyseerr:5055 by container name.
  # Seerr runs non-root (UID 1000) and requires init: true.
  # Rollback: Backups/jellyseerr_config_20260726-pre-seerr.tar.gz
  jellyseerr:
    image: ghcr.io/seerr-team/seerr:latest
    container_name: jellyseerr
    # 260 MB idle. Node, so it grows to fill what it is given -- a cap is what bounds it.
    mem_limit: 1g
    init: true
    environment:
      - TZ=Asia/Kolkata
      # Belt-and-braces, added 2026-07-28. Disabling IPv6 via the sysctl below
      # stops IPv6 TRAFFIC but does not stop the resolver returning AAAA
      # records, so Node can still try an unroutable IPv6 address first. This
      # makes it prefer A records.
      #
      # Honest note on provenance: this was added while chasing intermittent
      # "Connection reset by peer" errors reaching api.themoviedb.org, but it
      # was NOT shown to fix them -- those resets were reproduced with busybox
      # wget, which NODE_OPTIONS does not affect, and they continued afterwards
      # at the same rate. The app itself logs no TMDB errors at all, so the
      # resets look like CDN-side TLS behaviour against an unauthenticated
      # request, not a jellyseerr fault. Kept because preferring A records on an
      # IPv6-disabled stack is correct regardless. Do not cite it as the fix.
      - NODE_OPTIONS=--dns-result-order=ipv4first
    volumes:
      - jellyseerr_config:/app/config
    ports:
      - "5055:5055"
    dns:
      - 1.1.1.1
      - 8.8.8.8
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
    restart: always

  # Maintainerr moved orgs upstream: ghcr.io/jorenn92/maintainerr is frozen at
  # 2.19.0 (its :latest still points there). Current releases live at
  # ghcr.io/maintainerr/maintainerr. 3.x adds Jellyfin watch-history support,
  # which 2.19.0 lacked entirely (its Application enum had no Jellyfin entry).
  # 3.0 DB migrations are NOT backward compatible - rollback means restoring
  # Backups/maintainerr_config_20260726-pre-3x.tar.gz, not downgrading the image.
  # Runs as node (UID 1000); volume path /opt/data unchanged.
  maintainerr:
    image: ghcr.io/maintainerr/maintainerr:latest
    container_name: maintainerr
    # 205 MB idle. Collection rule evaluation is periodic and bounded.
    mem_limit: 1g
    environment:
      - TZ=Asia/Kolkata
    volumes:
      - maintainerr_config:/opt/data
    ports:
      - "6246:6246"
    restart: always

  cleanuparr:
    image: ghcr.io/cleanuparr/cleanuparr:latest
    container_name: cleanuparr
    # 247 MB idle.
    mem_limit: 1g
    environment:
      - PORT=11011
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Kolkata
    volumes:
      - cleanuparr_config:/config
    ports:
      - "11011:11011"
    restart: always

  # EXPERIMENTAL — Tiramisu torrent-streaming FUSE filesystem.
  # DISABLED 2026-07-26: mrrobotogit/tiramisu:latest (built 2026-07-19) is
  # broken upstream — docker-entrypoint.sh line 72 execs
  # /usr/local/bin/gostream, which is not shipped in the image. Container
  # exits 127 immediately. Host FUSE support was verified working
  # (/dev/fuse present, CAP_SYS_ADMIN granted), so this is purely an
  # upstream packaging bug. Re-enable once upstream ships gostream.
  # NOTE: do NOT bind-mount the fuse_mount_path (virtual) dir — the
  # container creates the FUSE mount there itself and logs
  # "Non-FUSE mountpoint ... (Docker bind), leaving intact" if pre-bound.
  #
  # tiramisu:
  #   image: mrrobotogit/tiramisu:latest
  #   container_name: tiramisu
  #   devices:
  #     - /dev/fuse
  #   cap_add:
  #     - SYS_ADMIN
  #     - NET_ADMIN
  #   security_opt:
  #     - apparmor:unconfined
  #   environment:
  #     - TZ=Asia/Kolkata
  #   volumes:
  #     - C:/ServerData/Tiramisu/config/config.json:/config.json:ro
  #     - C:/ServerData/Tiramisu/real:/mnt/tiramisu-mkv-real
  #   ports:
  #     - "8090:8090"
  #     - "9080:9080"
  #   restart: "no"

volumes:
  prowlarr_config:
    external: true
  bazarr_config:
    external: true
  radarr_config:
    external: true
  sonarr_config:
    external: true
  jellyseerr_config:
    external: true
  cleanuparr_config:
    external: true
  maintainerr_config:
    external: true
  qbittorrent_config:
    external: true
  jellyfin_config:
    external: true
