# ============================================================================
# Minecraft -- Tensura Evolutions (NeoForge, MC 1.21.1)
#
# JAVA EDITION ONLY. There is deliberately no Bedrock/Geyser port here.
# Geyser's own FAQ: "there is no way for Geyser to translate the features that
# most mods add (blocks, items, etc.), therefore servers that require mods to
# be installed clientside are unsupportable through Geyser." Tensura Evolutions
# adds custom blocks, items, mobs, dimensions and skills, so a Bedrock client
# cannot render this world. Adding 19132 would publish a port that either
# refuses connections or drops players into a broken world. See README.md.
# ============================================================================
services:
  minecraft:
    image: itzg/minecraft-server:java21     # MC 1.21.1 requires Java 21
    container_name: minecraft
    # unless-stopped, NOT the restart: always used everywhere else in this repo.
    # This is a deliberate exception and it is load-bearing.
    #
    # INCIDENT 2026-09-09: Minecraft holds ~5.4 GB on a host with 15.4 GB. With
    # restart:always it came back automatically every time the Docker engine
    # restarted -- including while nobody was playing -- and the box went into
    # swap exhaustion (SwapFree 880 kB of 3.1 GB). AdGuard was never stopped and
    # never crashed, but it was starved badly enough that its upstream DoH
    # queries timed out ("Client.Timeout exceeded while awaiting headers"), so
    # DNS for the whole house went down. Nothing looked broken: the container
    # was up, restarts=0.
    #
    # unless-stopped means a deliberate `docker compose stop` STAYS stopped
    # across engine restarts and reboots. Minecraft is now opt-in: it runs when
    # someone chooses to play, not by default. If it crashes WHILE running it
    # still restarts, which is the behaviour that actually matters.
    restart: unless-stopped
    stdin_open: true
    tty: true

    ports:
      - "25565:25565"                       # Java Edition only

    # REQUIRED, not decorative -- the same override every *arr service and
    # Jellyfin carries in this repo. Omitting it here cost a crash loop on
    # 2026-09-09: the modpack installer failed 9 times with
    #   java.net.UnknownHostException: Failed to resolve 'api.curseforge.com'
    #   DnsErrorCauseException: Query failed with SERVFAIL
    # OOMKilled was false and the exit code was 0, so it looked like a memory
    # problem and was not one. The ISP resolver SERVFAILs on external API
    # hostnames; a container without this silently loses the ability to reach
    # CurseForge, exactly as it silently loses TMDb elsewhere in this stack.
    dns:
      - 1.1.1.1
      - 8.8.8.8
    sysctls:
      net.ipv6.conf.all.disable_ipv6: 1

    # HARD memory ceiling, and it is load-bearing rather than tidiness.
    # This host has 15.4 GB total and the WSL2 VM is capped in .wslconfig. If
    # Minecraft is allowed to grow unbounded it exhausts the VM and the Linux
    # OOM killer picks a victim by score -- which would be jarvis-ollama or a
    # voice container, silently breaking the voice loop. With mem_limit set,
    # Docker kills MINECRAFT instead and restart:always brings it back. The
    # blast radius stays inside this stack.
    #   4G heap + ~512M metaspace (large mod count) + ~512M GC/threads/code
    #   cache + ~256M direct buffers = ~5.2G. 5632m leaves a little slack.
    #
    # 5632m (5.5G) NOT 7680m: this is the no-restart operating value. The WSL
    # VM cap is still 10 GB until the utility VM is restarted, and ~3.3 GB of
    # protected containers stay resident under game mode, so this is what
    # actually fits today. Raise to 7680m with MEMORY 6G once the VM restarts
    # and picks up the 11GB cap already written into .wslconfig.
    mem_limit: 6656m

    environment:
      EULA: "TRUE"
      TZ: Asia/Kolkata
      UID: "1000"
      GID: "1000"

      # ---- Modpack ------------------------------------------------------
      # CF_API_KEY is baked into this image for Java 17+ builds. Do NOT add
      # one here -- it would be a secret in a tracked file.
      TYPE: AUTO_CURSEFORGE

      # BLOCKED BY THE PACK AUTHORS, not by configuration. CF_SLUG cannot be
      # used for this pack: Tensura Evolutions has CurseForge's third-party
      # distribution flag set to "not allowed", so the API refuses to serve the
      # file to any automated installer. The first start failed with:
      #   "The modpack authors have indicated this file is not allowed for
      #    project distribution."
      # That is a deliberate choice by the authors. The only supported path is
      # a human downloading the zip and placing it in ./modpack/ -- see
      # modpack/PUT-THE-ZIP-HERE.txt.
      #
      # BOTH are required, and that is not obvious. CF_MODPACK_ZIP alone fails
      # with "A modpack page URL or slug identifier is required even with a
      # provided modpack zip" -- the installer still needs the project identity
      # to resolve the 313 individual mod files listed in the manifest. The zip
      # supplies the one file the API refuses to serve; the slug supplies the
      # identity. Neither works without the other for this pack.
      CF_SLUG: tensura-evolutions-1-21-1
      CF_MODPACK_ZIP: /modpacks/modpack.zip

      # NO CF_FILENAME_MATCHER NEEDED. It would pin which file the API resolves,
      # but the API is not being used to fetch the pack -- ./modpack/modpack.zip
      # IS the pin, and it cannot change unless someone replaces the file. The
      # running version is 1.0.69.9 (MC 1.21.1, NeoForge 21.1.249, 313 mods
      # declared, 253 installed server-side, 23 client-only excluded).
      # Upgrading means dropping in a new zip deliberately, which is the
      # correct amount of friction for a change that can break a live world.

      # ---- Memory -------------------------------------------------------
      # 5G. The manifest declares 313 mods, and 4G GC-thrashes a pack that
      # size while 6G would leave only ~1.26 GB of VM headroom. Still below the
      # pack's 8G recommendation -- that needs more physical RAM, not tuning.
      #
      # MEASURED 2026-09-09 with game mode on INCLUDING the jarvis stack: VM
      # MemAvailable 8.70 GB, of which 5.34 GB was MemFree -- memory the VM
      # already owns. A 5.2 GB footprint fits inside that free pool, so
      # Minecraft costs Windows nothing extra. 6G (7.3 GB) would exceed the
      # free pool and force the VM to claim ~2 GB more from a host that had
      # 1.65 GB available: paging, and therefore voice-loop latency. That is
      # the whole reason this is 4G. See README.md "Memory reality".
      MEMORY: 5G
      USE_AIKAR_FLAGS: "true"

      # ---- Auto-pause ---------------------------------------------------
      # SIGSTOPs the JVM when nobody is connected. Frees CPU, NOT RAM -- the
      # heap stays resident.
      #
      # MEASURED 2026-09-09, and it downgrades this feature: host CPU averaged
      # 21.9% across 16 logical processors, i.e. ~12 threads idle. CPU is NOT
      # the scarce resource here, RAM is -- and autopause does nothing for RAM.
      # So this is kept for the marginal win (no GC or chunk ticking while
      # nobody plays) rather than as the load-bearing optimisation it would be
      # on a busier box. Do not trade anything valuable to keep it.
      #
      # CONFLICT WITH THE HOMARR TILE -- read before changing either:
      # ANY tcp connect to 25565 wakes a paused server, a status ping included,
      # and itzg's autopause offers no way to distinguish a ping from a login.
      # A Homarr Minecraft widget polling every 30 s therefore keeps the server
      # awake permanently and autopause never engages at all. With the widget
      # set to a 10-minute interval it wakes, waits AUTOPAUSE_TIMEOUT_KN, and
      # re-pauses -- paused roughly 8 minutes in every 10, and the tile still
      # works. That interval is the whole reason both features can coexist; see
      # README.md "Homarr tile".
      ENABLE_AUTOPAUSE: "true"
      AUTOPAUSE_TIMEOUT_EST: "1800"         # 30 min after last player leaves
      AUTOPAUSE_TIMEOUT_INIT: "900"         # 15 min after boot with no joins
      AUTOPAUSE_TIMEOUT_KN: "120"           # re-pause 2 min after a bare ping

      # Required by autopause: a paused process makes one tick appear to last
      # for the whole pause, and the server watchdog would kill the server on
      # resume. Independently necessary for a heavy modpack, where chunk gen
      # legitimately blocks a tick past the default 60s watchdog.
      MAX_TICK_TIME: "-1"

      # ---- Performance tuning -------------------------------------------
      # 8/6 rather than the 10/10 default. Simulation distance is the
      # expensive one -- it drives entity ticking and is roughly quadratic.
      # Dropping 10 -> 6 is the single largest CPU and RAM saving available
      # without touching gameplay, and 6 chunks is still well beyond render
      # range for normal play.
      VIEW_DISTANCE: "8"
      SIMULATION_DISTANCE: "6"
      MAX_PLAYERS: "6"

      # ---- Gameplay -----------------------------------------------------
      DIFFICULTY: normal
      MOTD: "Tensura Evolutions"
      OPS: ""                               # set your Java username, then restart

      # ---- RCON ---------------------------------------------------------
      # Enabled for the Homarr tile and for graceful in-game shutdown, but
      # port 25575 is NOT published to the host. Homarr reaches it over the
      # minecraft_default network by container name. RCON is unauthenticated
      # beyond this password and grants full console -- it must never be
      # exposed on a host port.
      ENABLE_RCON: "true"
      RCON_PASSWORD: ${RCON_PASSWORD:?set in Stacks/minecraft/.env}

    volumes:
      # A NAMED VOLUME, not a bind mount from C:, and this is a performance
      # decision not a style one. Docker Desktop on Windows serves bind mounts
      # through a filesystem translation layer that is slow for many small
      # files -- which is exactly a Minecraft world (thousands of region files
      # plus constant chunk writes). A named volume lives on the VM's native
      # ext4 VHDX and avoids the translation entirely.
      - minecraft_data:/data
      # Read-only drop folder for the manually downloaded pack. Bind-mounted
      # from C: rather than a named volume precisely BECAUSE it is slow-path:
      # it is read once at startup, and a human has to be able to drag a file
      # into it from Explorer. :ro so the server can never modify or delete the
      # one copy of a file that cannot be re-downloaded automatically.
      - ./modpack:/modpacks:ro

volumes:
  minecraft_data:
    name: minecraft_data
